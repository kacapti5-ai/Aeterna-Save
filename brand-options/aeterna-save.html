<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeterna Save · 环带方案</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, "Noto Sans SC", sans-serif; background: #eef3fb; color: #234; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 36px 18px 72px; }
    h1 { font-size: 1.2rem; margin-bottom: 8px; }
    .lead { font-size: 0.9rem; color: #5a7394; line-height: 1.7; margin-bottom: 24px; }
    .grid { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border-radius: 12px; padding: 12px 12px 18px; box-shadow: 0 8px 24px rgba(30,88,224,0.08); }
    .tag { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #7aa0d6; padding: 8px 8px 0; }
    img { width: 100%; height: auto; display: block; }
    .pick { margin-top: 22px; font-size: 0.88rem; line-height: 1.6; background: #fff; padding: 14px 16px; border-left: 3px solid #1E58E0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>按这组环带参照 · 两套</h1>
    <p class="lead">布局和参照一样：上面是蓝青立体标，下面是 <strong>AETERNA SAVE</strong> + Slogan。无穷 = 永恒；双环 = 守护与交接扣在一起。</p>
    <div class="grid">
      <div class="card">
        <div class="tag">方案 1 · 无穷带</div>
        <img src="logo-aeterna-wordmark-dark.svg" alt="Infinity aeterna save">
      </div>
      <div class="card">
        <div class="tag">方案 2 · 双环相扣</div>
        <img src="logo-aeterna-wordmark-light.svg" alt="Circles aeterna save">
      </div>
    </div>
    <p class="pick">回 <strong>1</strong> 或 <strong>2</strong>。若要再做成参照里的 S 形、X 形或锁扣菱形，也可以指定。</p>
  </div>
</body>
</html>
