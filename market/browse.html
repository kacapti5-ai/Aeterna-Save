<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浏览商品 · Aeterna Save</title>
  <link rel="stylesheet" href="../css/brand.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/market.css">
</head>
<body class="market-body font-sans">

<div id="header"></div>

<main class="pt-20 pb-16">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <!-- 道具/账号页 · 平台交易依据说明 -->
    <div class="market-card p-5 md:p-6 mb-8 border-2 border-[#FFCB05]">
      <div class="flex flex-col md:flex-row md:items-start gap-4">
        <div class="w-12 h-12 rounded-lg bg-cyan-500/15 flex items-center justify-center shrink-0">
          <i class="fa fa-file-text-o text-cyan-400 text-xl"></i>
        </div>
        <div class="flex-1">
          <h2 class="font-bold text-lg mb-2 text-slate-800">平台有记录 · 未来交接更省心</h2>
          <p class="text-sm text-slate-500 leading-relaxed mb-3">
            在本平台买卖的<strong class="text-slate-700">账号、道具、素材</strong>都有<strong class="text-primary">永久交易记录</strong>。
            若已开通<strong class="text-pink-600">数字资产安心计划</strong>，家人未来需要时可调取依据——<strong class="text-slate-700">一切在平台上，都有记录。</strong>
          </p>
          <p class="text-xs text-slate-400">
            可搭配<a href="../index.html#legacy-guarantee" class="text-amber-600 hover:underline">香港保险自愿加保</a>，像给资产多买一份保险。
            <a href="../index.html#materials" class="text-orange-400 hover:underline ml-2">了解素材关联 →</a>
          </p>
        </div>
      </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-8">
      <!-- Step 2: 左侧筛选 -->
      <aside class="lg:w-64 flex-shrink-0">
        <div class="market-card p-5 filter-sidebar sticky top-24">
          <h3 class="font-bold mb-4 flex items-center gap-2"><i class="fa fa-filter text-orange-400"></i> 筛选</h3>
          <form id="filterForm" class="space-y-5 text-sm">
            <div>
              <label class="block text-gray-400 mb-2">搜索</label>
              <input type="text" name="q" placeholder="型号、皮肤名..." class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:border-orange-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-gray-400 mb-2">游戏</label>
              <select name="game" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-slate-700">
                <option value="all">全部游戏</option>
              </select>
            </div>
            <div>
              <label class="block text-gray-400 mb-2">类型</label>
              <select name="type" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-slate-700">
                <option value="all">全部类型</option>
                <option value="account">游戏账号</option>
                <option value="items">道具 / 素材</option>
                <option value="cards">TCG 卡牌</option>
                <option value="toys">实体玩具</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-500 mb-2">安心计划</label>
              <select name="legacy" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-slate-700">
                <option value="all">不限</option>
                <option value="yes">已开通安心计划</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-gray-400 mb-1 text-xs">最低价</label>
                <input type="number" name="minPrice" placeholder="0" class="w-full bg-white border border-slate-200 rounded px-2 py-1.5 text-slate-700 text-sm">
              </div>
              <div>
                <label class="block text-gray-400 mb-1 text-xs">最高价</label>
                <input type="number" name="maxPrice" placeholder="99999" class="w-full bg-white border border-slate-200 rounded px-2 py-1.5 text-slate-700 text-sm">
              </div>
            </div>
            <button type="submit" class="btn-g2g w-full py-2.5">应用筛选</button>
            <button type="button" id="resetFilter" class="btn-outline-g2g w-full py-2 text-gray-400 text-sm">重置</button>
          </form>
        </div>
      </aside>

      <!-- Step 2+3: 右侧商品网格 -->
      <div class="flex-1 min-w-0">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
          <div>
            <h1 class="text-xl font-bold">浏览商品</h1>
            <p class="text-sm text-gray-500 mt-1">共 <span id="resultCount">0</span> 件 · 验卡 · 验真 · 托管 · 可选安心计划</p>
          </div>
          <select id="sortBy" class="bg-white border-2 border-amber-200 rounded-lg px-3 py-2 text-sm text-[#1D355C]">
            <option value="default">默认排序</option>
            <option value="price-asc">价格从低到高</option>
            <option value="price-desc">价格从高到低</option>
            <option value="rating">评分最高</option>
          </select>
        </div>
        <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4" id="productGrid"></div>
        <div id="emptyState" class="hidden text-center py-16 text-gray-500">
          <i class="fa fa-search text-4xl mb-4 opacity-50"></i>
          <p>没有找到匹配的商品</p>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="border-t border-gray-800 py-6 text-center text-sm text-gray-500">
  <a href="index.html" class="text-orange-400 hover:underline">← 返回市场首页</a>
</footer>

<script src="js/data.js"></script>
<script src="js/market.js"></script>
<script>
marketReady.then(() => {
  document.getElementById('header').innerHTML = renderMarketHeader('browse');
  initMobileMenu();

  const gameSelect = document.querySelector('[name=game]');
  MARKET_GAMES.forEach(g => {
    gameSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`;
  });

  const params = new URLSearchParams(location.search);
  const form = document.getElementById('filterForm');
  if (params.get('game')) form.game.value = params.get('game');
  if (params.get('type')) form.type.value = params.get('type');

  function getFilters() {
    const fd = new FormData(form);
    return {
      q: fd.get('q') || '',
      game: fd.get('game') || 'all',
      type: fd.get('type') || 'all',
      legacy: fd.get('legacy') || 'all',
      minPrice: fd.get('minPrice') || '',
      maxPrice: fd.get('maxPrice') || '',
    };
  }

  function renderGrid() {
    let list = filterProducts(getFilters());
    const sort = document.getElementById('sortBy').value;
    if (sort === 'price-asc') list.sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
    if (sort === 'rating') list.sort((a, b) => b.sellerRating - a.sellerRating);

    document.getElementById('resultCount').textContent = list.length;
    document.getElementById('productGrid').innerHTML = list.map(renderProductCard).join('');
    document.getElementById('emptyState').classList.toggle('hidden', list.length > 0);
    document.getElementById('productGrid').classList.toggle('hidden', list.length === 0);
  }

  form.addEventListener('submit', e => { e.preventDefault(); renderGrid(); });
  document.getElementById('resetFilter').addEventListener('click', () => { form.reset(); renderGrid(); });
  document.getElementById('sortBy').addEventListener('change', renderGrid);
  renderGrid();
});
</script>
</body>
</html>
