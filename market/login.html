<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卖家登录 · Aeterna Save</title>
  <link rel="stylesheet" href="../css/brand.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/market.css">
</head>
<body class="market-body font-sans">
<div id="header"></div>
<main class="pt-24 pb-16">
  <div class="max-w-md mx-auto px-4">
    <h1 class="text-2xl font-bold mb-2 text-[#1D355C]">卖家登录</h1>
    <p class="text-slate-500 mb-6 text-sm">登录后上架或管理你的商品。</p>
    <form id="loginForm" class="market-card p-6 space-y-4 text-sm">
      <label class="block">账号
        <input name="login" required class="mt-1 w-full border rounded-lg px-3 py-2.5" autocomplete="username">
      </label>
      <label class="block">密码
        <input name="password" type="password" required class="mt-1 w-full border rounded-lg px-3 py-2.5" autocomplete="current-password">
      </label>
      <p id="loginError" class="hidden text-red-500"></p>
      <button class="btn-g2g w-full py-2.5">登录</button>
      <p class="text-slate-400 text-xs">还没有店铺？<a href="register.html" class="text-[#1E58E0]">免费注册</a></p>
    </form>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/market.js"></script>
<script src="js/account.js"></script>
<script>
const next = new URLSearchParams(location.search).get("next") || "mine.html";
marketReady.then(async () => {
  document.getElementById("header").innerHTML = renderMarketHeader("sell");
  initMobileMenu();
  const me = await mountSellerNav("sell");
  if (me) location.replace(next);
});
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("loginError");
  err.classList.add("hidden");
  const f = e.target;
  try {
    const data = await sellerApi("/api/seller/login", {
      method: "POST",
      body: JSON.stringify({ login: f.login.value, password: f.password.value }),
    });
    setSellerToken(data.token);
    location.href = next.startsWith("http") ? "mine.html" : next;
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove("hidden");
  }
});
</script>
</body>
</html>
